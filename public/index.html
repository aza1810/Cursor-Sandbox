<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1220;
        --card: #1a1f36;
        --accent: #6c8cff;
        --accent-2: #9b6cff;
        --text: #e7e9f3;
        --muted: #9aa0b5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #24284a 0%, var(--bg) 55%);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }
      main { width: 100%; max-width: 560px; }
      .hero { text-align: center; margin-bottom: 28px; }
      .hero h1 {
        font-size: 2rem;
        margin: 0 0 8px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p { color: var(--muted); margin: 0; }
      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      form { display: flex; gap: 10px; margin-bottom: 16px; }
      input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #0e1226;
        color: var(--text);
        font-size: 1rem;
      }
      input:focus { outline: 2px solid var(--accent); }
      button {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
      li {
        background: #0e1226;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      li time { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
      .empty { color: var(--muted); text-align: center; padding: 12px 0; }
      .status { text-align: center; margin-top: 18px; color: var(--muted); font-size: 0.85rem; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #37d67a; margin-right: 6px; }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <h1>Cursor Sandbox</h1>
        <p>A tiny notes app to prove the dev environment runs end to end.</p>
      </div>
      <div class="card">
        <form id="note-form">
          <input id="note-input" type="text" placeholder="Write a note…" autocomplete="off" required />
          <button type="submit">Add</button>
        </form>
        <ul id="note-list"></ul>
        <p class="empty" id="empty">No notes yet — add one above.</p>
      </div>
      <p class="status"><span class="dot"></span><span id="health">checking server…</span></p>
    </main>

    <script>
      const list = document.getElementById("note-list");
      const empty = document.getElementById("empty");
      const form = document.getElementById("note-form");
      const input = document.getElementById("note-input");
      const health = document.getElementById("health");

      function render(notes) {
        list.innerHTML = "";
        empty.style.display = notes.length ? "none" : "block";
        for (const note of notes) {
          const li = document.createElement("li");
          const text = document.createElement("span");
          text.textContent = note.text;
          const time = document.createElement("time");
          time.textContent = new Date(note.createdAt).toLocaleTimeString();
          li.append(text, time);
          list.appendChild(li);
        }
      }

      async function loadNotes() {
        const res = await fetch("/api/notes");
        const data = await res.json();
        render(data.notes);
      }

      async function loadHealth() {
        try {
          const res = await fetch("/api/health");
          const data = await res.json();
          health.textContent = `server ${data.status} · uptime ${data.uptime.toFixed(1)}s`;
        } catch {
          health.textContent = "server unreachable";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        input.value = "";
        await loadNotes();
      });

      loadNotes();
      loadHealth();
    </script>
  </body>
</html>
